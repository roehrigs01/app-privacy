name: Cleanup GitHub Actions Runs

on:
  schedule:
    - cron: '0 20 * * 0' # 4 PM EDT
    - cron: '0 21 * * 0' # 4 PM EST
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-actions-runs
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete expired completed runs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Eastern local time
        id: eastern
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$(TZ=America/New_York date +%H)" == "16" ]]; then
            echo "run_cleanup=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_cleanup=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Delete old completed workflow runs
        if: steps.eastern.outputs.run_cleanup == 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const now = Date.now();
            const day = 24 * 60 * 60 * 1000;
            const successfulCutoff = now - 30 * day;
            const unsuccessfulCutoff = now - 14 * day;
            let deletedSuccessful = 0;
            let deletedUnsuccessful = 0;
            let examined = 0;
            const errors = [];

            // GitHub lists runs newest first. Stop once all remaining
            // completed runs are older than 14 days, after processing them.
            for await (const response of github.paginate.iterator(
              github.rest.actions.listWorkflowRunsForRepo,
              { ...context.repo, status: 'completed', per_page: 100 }
            )) {
              for (const run of response.data) {
                examined++;
                if (run.id === context.runId) continue;
                const completedAt = Date.parse(run.updated_at || run.created_at);
                if (!Number.isFinite(completedAt)) continue;
                const successful = run.conclusion === 'success';
                const cutoff = successful ? successfulCutoff : unsuccessfulCutoff;
                if (completedAt >= cutoff) continue;

                try {
                  await github.rest.actions.deleteWorkflowRun({
                    ...context.repo,
                    run_id: run.id
                  });
                  if (successful) deletedSuccessful++;
                  else deletedUnsuccessful++;
                  core.info(`Deleted ${run.conclusion || 'unsuccessful'} run #${run.run_number} (${run.id})`);
                } catch (error) {
                  errors.push(`Run ${run.id}: ${error.message}`);
                  core.warning(`Could not delete run ${run.id}: ${error.message}`);
                }
              }
            }

            const summary = [
              '### GitHub Actions cleanup',
              `Completed runs examined: ${examined}`,
              `Successful runs deleted (older than 30 days): ${deletedSuccessful}`,
              `Other completed runs deleted (older than 14 days): ${deletedUnsuccessful}`,
              `Deletion errors: ${errors.length}`
            ].join('\n');
            await core.summary.addRaw(summary + '\n').write();
            if (errors.length) core.setFailed(`Failed to delete ${errors.length} expired runs`);
